apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-recon
  labels:
    app.kubernetes.io/name: ozone
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: recon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ozone
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: recon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ozone
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: recon
    spec:
      initContainers:
        - name: wait-om
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-om-0.{{ .Release.Name }}-om.{{ .Release.Namespace }}.svc.cluster.local 9862; do echo waiting for OM; sleep 5; done']
      containers:
        - name: recon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/hadoop/bin/ozone"]
          args: ["recon"]
          ports:
            - name: http
              containerPort: 9888
          volumeMounts:
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/ozone-site.xml
              subPath: ozone-site.xml
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/log4j.properties
              subPath: log4j.properties
          resources:
            {{- toYaml .Values.resources.recon | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 9888
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
