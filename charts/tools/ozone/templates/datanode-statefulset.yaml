apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-datanode
  labels:
    app.kubernetes.io/name: ozone
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: datanode
spec:
  serviceName: {{ .Release.Name }}-datanode
  replicas: {{ .Values.ozone.datanode.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ozone
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: datanode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ozone
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: datanode
    spec:
      initContainers:
        - name: wait-scm
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-scm-0.{{ .Release.Name }}-scm.{{ .Release.Namespace }}.svc.cluster.local 9860; do echo waiting for SCM; sleep 5; done']
      containers:
        - name: datanode
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/hadoop/bin/ozone"]
          args: ["datanode"]
          ports:
            - name: rpc
              containerPort: 9858
            - name: http
              containerPort: 9882
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/ozone-site.xml
              subPath: ozone-site.xml
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/log4j.properties
              subPath: log4j.properties
          resources:
            {{- toYaml .Values.resources.datanode | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 9882
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- if ne .Values.persistence.type "pvc" }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if eq .Values.persistence.type "pvc" }}
  # Sibling of `template`, NOT inside template.spec. Indented at 6 spaces it
  # landed in spec.template.spec, where Kubernetes silently discards it as an
  # unknown field -- no PVC was ever created, and the container's
  # `volumeMounts: - name: data` then failed with `Not found: "data"`, taking
  # the whole install down. Only the pvc path was affected; the ephemeral
  # branch above supplies its own emptyDir named `data`, which is why this
  # went unnoticed and why Ozone could only ever run without persistence.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.datanode.size }}
  {{- end }}
