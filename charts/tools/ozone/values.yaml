image:
  repository: apache/ozone
  tag: "1.4.0"
  pullPolicy: IfNotPresent

ozone:
  om:
    replicas: 1
  scm:
    replicas: 1
  datanode:
    replicas: 3

persistence:
  type: pvc            # pvc | emptyDir
  storageClass: ""
  datanode: {size: 100Gi}
  om: {size: 10Gi}
  scm: {size: 10Gi}

omService:
  type: NodePort
  nodePort: 30500

s3gService:
  type: NodePort
  nodePort: 30878

reconService:
  type: NodePort
  nodePort: 30501

hdfs:
  enabled: false

resources:
  om:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  scm:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  datanode:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  # s3g and recon are JVMs (heap = 1/4 of the container limit under Java 11's
  # container support). At a 512Mi limit both were OOMKilled ~5s into startup,
  # every restart, forever -- 1536Mi/2Gi is the floor at which Ozone 1.4
  # actually comes up.
  s3g:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1536Mi
  recon:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
