apiVersion: v2
name: bdp
description: Bluechip Data Platform — management plane for data tools on Kubernetes
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: "13.4.4"
    repository: https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.19.4"
    repository: https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami
    condition: redis.enabled
  - name: keycloak
    version: "21.4.4"
    repository: https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami
    condition: keycloak.enabled
