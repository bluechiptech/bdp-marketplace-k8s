apiVersion: v2
name: bdp
description: Bluechip Data Platform — management plane for data tools on Kubernetes
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: "13.4.4"
    repository: https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.19.4"
    repository: https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami
    condition: redis.enabled
  - name: keycloak
    version: "21.4.4"
    repository: https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami
    condition: keycloak.enabled
  # cert-manager — prerequisite for KServe's admission webhooks (and any other
  # cert-consuming tool). Installed with the platform so those tools can later
  # be provisioned via BDP.
  - name: cert-manager
    version: v1.15.3
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
  # KServe CRDs — must exist before the KServe controller (which BDP installs
  # as a service) can validate/serve ClusterServingRuntimes.
  - name: kserve-crd
    version: v0.13.0
    repository: oci://ghcr.io/kserve/charts
    condition: kserve-crd.enabled
  # Observability stack (Task E1) — metrics (prometheus-operator + grafana)
  # and logs (loki). Vendored decompressed like the rest of charts/bdp/charts/.
  - name: kube-prometheus-stack
    version: "87.19.2"
    repository: https://prometheus-community.github.io/helm-charts
    condition: observability.enabled
  - name: loki
    version: "7.1.0"
    repository: https://grafana.github.io/helm-charts
    condition: observability.enabled
  # Log collector (Task H1) — DaemonSet that discovers every pod cluster-wide
  # and ships its logs to the Loki instance above. Without this, Loki's PVC
  # never receives a single write. Same condition as the rest of the
  # observability stack, same vendoring treatment (decompressed, gitignored).
  - name: alloy
    version: "1.11.0"
    repository: https://grafana.github.io/helm-charts
    condition: observability.enabled
  # Ingress controller. Bundled because the chart's own Ingress is inert
  # without one: nothing claims it, no LoadBalancer is created, and the
  # platform ends up with no public address at all. Marketplace customers were
  # landing on a cluster of healthy pods with no way to reach any of them.
  # Turn it off (ingress-nginx.enabled=false) on a cluster that already has a
  # controller, and point global.ingressClassName at that one instead.
  - name: ingress-nginx
    version: "4.15.1"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
