  # Registry holding the BDP images (marketplace-managed ACR in listings).
  # DISPLAY-ONLY: no template reads it — every image resolves through the
  # global.azure.images digest map above. Kept because offer/aws/listing.yaml
  # and the install docs surface it as a parameter. To point an install at a
  # different registry, use a values file generated by
  # scripts/gen-registry-values.sh (e.g. charts/bdp/values-ghcr.yaml), which
  # swaps the registry on every global.azure.images entry and subchart block
  # at once — a --set of this key alone changes nothing.
  # NOTE: deliberately NOT named imageRegistry — global.imageRegistry is a
  # Bitnami convention and would re-prefix the postgresql/redis/keycloak
  # subchart images too.
  bdpImageRegistry: bdpmarketplace.azurecr.io/bdp
  # Unused by the templates -- images resolve through global.azure.images
  # digests. Kept in step with the release so it cannot mislead anyone reading
  # it as the version that ships.
  bdpImageTag: "1.0.6"
  # Namespace installed data tools (and their per-tool UI Ingresses) live in.
  toolsNamespace: bdp-services
  # Domain the customer points at the ingress. Everything derives from it:
  # UI https://<domain>, API https://<domain>/api, Keycloak https://keycloak.<domain>
  externalDomain: bdp.example.com
  ingressClassName: nginx
  # Name of the secret holding the platform's TLS certificate. The Ingress
  # reads it, and with tls.mode "acme" cert-manager writes it. Empty means the
  # whole platform is served over plain HTTP -- including Keycloak, which
  # issues every token.
  tlsSecretName: ""
  tls:
    # Where the certificate comes from.
    #
    #   existing - you provide the secret named above yourself (a wildcard
    #              certificate, an Azure Key Vault sync, whatever you already
    #              have). Leave tlsSecretName empty for plain HTTP.
    #   acme     - ask the bundled cert-manager for one from Let's Encrypt.
    #              Requires global.adminEmail, global.tlsSecretName, and
    #              global.externalDomain already resolving to this cluster's
    #              ingress address, because the challenge is fetched over the
    #              public internet.
    #
    # Defaults to "existing" so an upgrade cannot start making calls to an
    # external certificate authority on somebody's behalf.
    mode: existing
    # Staging (https://acme-staging-v02.api.letsencrypt.org/directory) issues
    # untrusted certificates but has far higher rate limits -- worth using
    # while getting DNS right, because the production endpoint locks you out
    # for a week after five failures on the same name.
    acmeServer: https://acme-v02.api.letsencrypt.org/directory
  # SECURITY: leave false for any real deployment. When true, the UI pod skips
  # TLS verification on its server-side OIDC calls (NODE_TLS_REJECT_UNAUTHORIZED=0)
  # so it accepts the ingress controller's self-signed default cert. Only for
  # throwaway testing without a real certificate — provide global.tlsSecretName
  # (e.g. via cert-manager) instead so verification stays on.
  insecureSkipTlsVerify: false
  # Air-gap registry (e.g. the marketplace ACR: myregistry.azurecr.io). When set,
  # bdp-service-manager pulls tool charts as OCI artifacts from <registry>/charts/*
  # and redirects their images to <registry>/tools/* — nothing is fetched from
  # public registries. Empty leaves public-repo behaviour (dev/self-managed).
  airgapRegistry: ""
  # Credentials the provisioner uses to authenticate helm's OCI chart pull from
  # a PRIVATE air-gap registry (leave empty if the registry allows anonymous
  # pull, which is fine for public tool charts). Stored in a Secret, not env.
  airgapRegistryUsername: ""
  airgapRegistryPassword: ""
  # Image pull secrets attached to the BDP workload pods (services, UI, seed
  # job, billing cron, pod janitor). Kubernetes-format list, e.g.
  #   imagePullSecrets: [{name: bdp-registry-cred}]
  # Empty (the default) renders nothing: on AKS the kubelet pulls from the
  # marketplace ACR through the cluster's AcrPull managed identity
  # (--attach-acr), so no secret exists or is needed there. Any OTHER cluster
  # pulling from a private registry must set this or every pod goes
  # ImagePullBackOff. The same key is honored natively by the
  # postgresql/redis/keycloak, cert-manager and kube-prometheus-stack
  # subcharts; loki reads its chart-local `loki.imagePullSecrets` and alloy
  # reads `global.image.pullSecrets` — docs/INSTALL-GENERIC.md shows the three
  # keys set together.
  imagePullSecrets: []
  # Convenience: materialize a kubernetes.io/dockerconfigjson pull secret from
  # literal credentials at install time (templates/registry-secret.yaml). The
  # secret is created in BOTH the release namespace and toolsNamespace,
  # because imagePullSecrets are namespace-scoped and provisioned tool pods
  # pull from the same registry. Creating it does not attach it — list its
  # name in global.imagePullSecrets above. Where possible prefer a
  # pre-created secret (kubectl create secret docker-registry) so credentials
  # stay out of values files and helm release history.
  registryCredentials:
    create: false
    name: bdp-registry-cred
    registry: ""            # e.g. ghcr.io
    username: ""
    password: ""            # for GHCR: a token with read:packages
  # Administrator contact captured from the marketplace UI (Task F1). Not yet
  # consumed by a specific service — reserved for future support/notification
  # wiring. Purely a pass-through value today.
  adminEmail: ""
  # Global StorageClass override for platform PersistentVolumeClaims. Empty
  # (default) leaves postgresql/redis/keycloak's embedded postgresql on the
  # cluster's default StorageClass, exactly as before this key existed — the
  # Bitnami subcharts already read global.storageClass via their own
  # common.storage.class helper (see charts/bdp/charts/{postgresql,redis}),
  # so no template changes were needed here. New-install only: changing this
  # after deployment does not move or resize existing volumes.
  storageClass: ""
  # Cluster-internal IP the UI pod uses to reach keycloak.<domain> for server-side
  # OIDC token calls. Managed-K8s load balancers often do not hairpin (a pod
  # cannot dial the cluster's own public LB IP), so map the external Keycloak
  # host to the ingress controller's ClusterIP here. Empty = rely on normal DNS
  # (works when the LB hairpins or an external resolver is reachable).
  keycloakHostAliasIp: ""

billing:
  # byol | flat | metered — set per marketplace plan.
  # byol mounts the licenseSecretName secret into bdp-license-manager at
  # /etc/bdp/license/license.key and enables SIGNED license enforcement: the
  # file must be a vendor-signed (Ed25519) license produced by
  # bdp-platform/scripts/license/sign-license.sh; it is verified against the
  # public key baked into the bdp-license-manager image. Create it with:
  #   kubectl create secret generic bdp-license -n <ns> --from-file=license.key
  mode: flat
  licenseSecretName: bdp-license   # byol: secret with key "license.key"
  metered:
    schedule: "0 * * * *"
    azure:
      resourceId: ""
      planId: ""
      dimension: bdp_core_hours
    aws:
      productCode: ""
      dimension: BDPCoreHours

postgresql:
  enabled: true
  # Fixed name: keycloak's externalDatabase.host must be a literal, and it
  # also guarantees no collision with any keycloak-embedded postgresql.
  fullnameOverride: bdp-postgres
  image:
    registry: bdpmarketplace.azurecr.io
    repository: bdp/postgresql
    digest: sha256:04f3b0dfdb150a29404b92e180e38cad893f72ff59b1b5816827cbfb579e6c9c
  auth:
    postgresPassword: ""        # empty -> chart-generated
  primary:
    persistence:
      size: 20Gi
    initdb:
      scripts:
        # NOTE: values files are not templated — this must stay literal SQL.
        create-bdp-databases.sql: |
          CREATE USER keycloak WITH PASSWORD 'keycloak'; CREATE DATABASE keycloak OWNER keycloak;
          CREATE USER bdp_auth WITH PASSWORD 'bdp_auth'; CREATE DATABASE bdp_auth OWNER bdp_auth;
          CREATE USER bdp_catalog WITH PASSWORD 'bdp_catalog'; CREATE DATABASE bdp_catalog OWNER bdp_catalog;
          CREATE USER bdp_security WITH PASSWORD 'bdp_security'; CREATE DATABASE bdp_security OWNER bdp_security;
          CREATE USER bdp_sql WITH PASSWORD 'bdp_sql'; CREATE DATABASE bdp_sql OWNER bdp_sql;
          CREATE USER bdp_domain WITH PASSWORD 'bdp_domain'; CREATE DATABASE bdp_domain OWNER bdp_domain;
          CREATE USER bdp_backup WITH PASSWORD 'bdp_backup'; CREATE DATABASE bdp_backup OWNER bdp_backup;
          CREATE USER bdp_config WITH PASSWORD 'bdp_config'; CREATE DATABASE bdp_config OWNER bdp_config;
          CREATE USER bdp_metering WITH PASSWORD 'bdp_metering'; CREATE DATABASE bdp_metering OWNER bdp_metering;
          CREATE USER bdp_license WITH PASSWORD 'bdp_license'; CREATE DATABASE bdp_license OWNER bdp_license;
          CREATE USER bdp_update WITH PASSWORD 'bdp_update'; CREATE DATABASE bdp_update OWNER bdp_update;
          CREATE USER bdp_keymanager WITH PASSWORD 'bdp_keymanager'; CREATE DATABASE bdp_keymanager OWNER bdp_keymanager;
          CREATE USER bdp_notification WITH PASSWORD 'bdp_notification'; CREATE DATABASE bdp_notification OWNER bdp_notification;
          CREATE USER bdp_pipeline WITH PASSWORD 'bdp_pipeline'; CREATE DATABASE bdp_pipeline OWNER bdp_pipeline;
          CREATE USER bdp_storage WITH PASSWORD 'bdp_storage'; CREATE DATABASE bdp_storage OWNER bdp_storage;
          CREATE USER bdp_cloud WITH PASSWORD 'bdp_cloud'; CREATE DATABASE bdp_cloud OWNER bdp_cloud;
          CREATE USER bdp_cluster WITH PASSWORD 'bdp_cluster'; CREATE DATABASE bdp_cluster OWNER bdp_cluster;
          CREATE USER bdp_cluster_registry WITH PASSWORD 'bdp_cluster_registry'; CREATE DATABASE bdp_cluster_registry OWNER bdp_cluster_registry;
          CREATE USER bdp_registry WITH PASSWORD 'bdp_registry'; CREATE DATABASE bdp_registry OWNER bdp_registry;
          CREATE USER bdp_service WITH PASSWORD 'bdp_service'; CREATE DATABASE bdp_service OWNER bdp_service;
          CREATE USER bdp_oracle_migration WITH PASSWORD 'bdp_oracle_migration'; CREATE DATABASE bdp_oracle_migration OWNER bdp_oracle_migration;

redis:
  enabled: true
  image:
    registry: bdpmarketplace.azurecr.io
    repository: bdp/redis
    digest: sha256:c1843bcdb2f413d2aff67adbaf482082673cd40ec602fa9fefad74ec685cb813
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      # Explicit for documentation parity with postgresql.primary.persistence.size
      # above — this matches the subchart's own default (charts/redis/values.yaml),
      # so setting it here changes nothing; it's the marketplace UI's redisSizeGi
      # parameter target (Task F1).
      size: 8Gi

keycloak:
  enabled: true
  image:
    registry: bdpmarketplace.azurecr.io
    repository: bdp/keycloak
    digest: sha256:4879f37d618c7a2bc4c3cdf502e88dbd3d4aec7a867f77608a04a7fd6c1078f0
  auth:
    adminUser: admin
    adminPassword: ""           # empty -> chart-generated
  proxy: edge
  # Production mode. The chart's default is false, which starts Keycloak with
  # `start-dev`: dev-mode caching (so no clustering or session replication) and
  # hostname checks disabled. Keycloak's own documentation is explicit that
  # start-dev must not be used in production, and it shipped that way here.
  #
  # Requires the hostname below and TLS terminated upstream -- `proxy: edge`
  # above already says that is the arrangement.
  production: true
  httpRelativePath: "/"
  # Keycloak has to know the URL browsers reach it on. It bakes that into every
  # token issuer, discovery document and redirect, so getting it wrong produces
  # a login that appears to work and then fails validation in every service.
  #
  # The subchart only sets this when its OWN ingress is enabled, and it is not:
  # the umbrella's Ingress routes keycloak.<externalDomain> to this service
  # instead. So it is set explicitly here.
  #
  # The scheme follows whether a certificate exists. With global.tlsSecretName
  # set the ingress serves HTTPS and Keycloak must advertise https; without one
  # it serves plain HTTP, and advertising https would make every redirect fail.
  extraEnvVars:
    - name: KC_HOSTNAME_URL
      value: "http{{ if .Values.global.tlsSecretName }}s{{ end }}://keycloak.{{ .Values.global.externalDomain }}"
    - name: KC_HOSTNAME_ADMIN_URL
      value: "http{{ if .Values.global.tlsSecretName }}s{{ end }}://keycloak.{{ .Values.global.externalDomain }}"
  # The chart's default "small" resources preset OOM-kills (exit 137) the
  # kc.sh build/augmentation phase — give Keycloak real memory.
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 3Gi }   # 2Gi still OOMs the Quarkus augmentation burst
  # Share the platform postgres instead of the chart's embedded one — the
  # embedded subchart renders the same resource names and collides.
  postgresql:
    enabled: false
  externalDatabase:
    host: bdp-postgres
    port: 5432
    user: keycloak
    database: keycloak
    password: keycloak

ui:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }

# One entry per platform service. A single template generates
# Deployment + Service for each. extraEnv carries the service's
# cross-service URLs (in-cluster DNS instead of the localhost defaults
# baked into application.yml).
serviceDefaults:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

services:
  bdp-service-registry:    { port: 7013, db: bdp_registry }
  bdp-auth-service:        { port: 7001, db: bdp_auth }
  bdp-cluster-registry:    { port: 7018, db: bdp_cluster_registry }
  bdp-cluster-manager:
    port: 7002
    db: bdp_cluster
    # Lists/cordons/drains nodes of the LOCAL deployment target through its
    # own SA (RBAC in services.yaml — the default SA has none and node reads
    # 403). Kubeconfigs for other targets come from the cluster-registry;
    # application.yml defaults that URL to 127.0.0.1:7018 (the VM layout),
    # which in-cluster fails with ResourceAccessException -> CM-0040.
    serviceAccount: bdp-cluster-manager
    extraEnv:
      BDP_CLUSTER_REGISTRY_URL: http://bdp-cluster-registry:7018
  bdp-config-manager:      { port: 7004, db: bdp_config }
  bdp-service-manager:
    port: 7003
    # Reads pod/secret/service state across the cluster to report install
    # progress and health, and scales tool workloads on start/stop. Needs its
    # own RBAC (the default SA has none) — SA + ClusterRole in services.yaml.
    serviceAccount: bdp-service-manager
    db: bdp_service
    extraEnv:
      BDP_CLIENTS_PROVISIONERURL: http://bdp-provisioner:7014
      BDP_CLIENTS_REGISTRYURL: http://bdp-service-registry:7013
      BDP_CLIENTS_SQLENGINEURL: http://bdp-sql-engine:7008
      BDP_SUPERSET_URL: http://superset.bdp-services.svc.cluster.local:8088
      # Managed cloud K8s: expose installed tool UIs via a per-tool subdomain
      # ingress (https://<tool>.<externalDomain>), not NodePort (unreachable).
      BDP_UI_ACCESS_MODE: ingress
  bdp-storage-manager:
    port: 7005
    db: bdp_storage
    extraEnv:
      MINIO_ENDPOINT: http://minio.bdp-services.svc.cluster.local:9000
      BDP_ICEBERG_REST_URL: http://iceberg-lakekeeper.bdp-services.svc.cluster.local:8181/catalog
  bdp-pipeline-manager:    { port: 7006, db: bdp_pipeline }
  bdp-sql-engine:
    port: 7008
    db: bdp_sql
    extraEnv:
      BDP_TRINO_JDBC_URL: jdbc:trino://trino.bdp-services.svc.cluster.local:8080
  bdp-catalog:
    port: 7009
    db: bdp_catalog
    extraEnv:
      BDP_TRINO_JDBC_URL: jdbc:trino://trino.bdp-services.svc.cluster.local:8080
      MINIO_ENDPOINT: http://minio.bdp-services.svc.cluster.local:9000
  bdp-domain-manager:      { port: 7019, db: bdp_domain }
  bdp-security-policies:   { port: 7010, db: bdp_security }
  bdp-key-manager:         { port: 7020, db: bdp_keymanager }
  bdp-oracle-migration:
    port: 7023
    db: bdp_oracle_migration
    extraEnv:
      TRINO_JDBC_URL: jdbc:trino://trino.bdp-services.svc.cluster.local:8080
      MINIO_ENDPOINT: http://minio.bdp-services.svc.cluster.local:9000
  bdp-notification-service: { port: 7011, db: bdp_notification }
  bdp-backup-manager:
    port: 7012
    db: bdp_backup
    extraEnv:
      MINIO_ENDPOINT: http://minio.bdp-services.svc.cluster.local:9000
  bdp-license-manager:     { port: 7007, db: bdp_license }
  bdp-metering:            { port: 7016, db: bdp_metering }
  bdp-update-agent:        { port: 7017, db: bdp_update }
  bdp-cloud-providers:     { port: 7015, db: bdp_cloud }
  bdp-provisioner:
    port: 7014
    # In-cluster: provisioner installs data tools via its ServiceAccount,
    # not a host kubeconfig. RBAC granted in templates/services.yaml.
    serviceAccount: bdp-provisioner
    extraEnv:
      # Fetches each deployment target's kubeconfig from the cluster-registry.
      # application.yml defaults this to 127.0.0.1:7018 (the VM layout), which
      # is unreachable in-cluster and aborts installs with ResourceAccessException.
      BDP_CLUSTER_REGISTRY_URL: http://bdp-cluster-registry:7018
  bdp-gateway:
    port: 7000
    # Gateway route targets — in-cluster DNS. bdp-gateway application.yml wraps
    # each route uri in ${BDP_SVC_<port>} / ${BDP_WS_<port>} (default 127.0.0.1
    # for the VM); these point them at the cluster service DNS instead.
    extraEnv:
      BDP_SVC_7001: http://bdp-auth-service:7001
      BDP_SVC_7002: http://bdp-cluster-manager:7002
      BDP_SVC_7003: http://bdp-service-manager:7003
      BDP_SVC_7004: http://bdp-config-manager:7004
      BDP_SVC_7005: http://bdp-storage-manager:7005
      BDP_SVC_7006: http://bdp-pipeline-manager:7006
      BDP_SVC_7007: http://bdp-license-manager:7007
      BDP_SVC_7008: http://bdp-sql-engine:7008
      BDP_SVC_7009: http://bdp-catalog:7009
      BDP_SVC_7010: http://bdp-security-policies:7010
      BDP_SVC_7011: http://bdp-notification-service:7011
      BDP_SVC_7012: http://bdp-backup-manager:7012
      BDP_SVC_7013: http://bdp-service-registry:7013
      BDP_SVC_7015: http://bdp-cloud-providers:7015
      BDP_SVC_7016: http://bdp-metering:7016
      BDP_SVC_7017: http://bdp-update-agent:7017
      BDP_SVC_7018: http://bdp-cluster-registry:7018
      BDP_SVC_7019: http://bdp-domain-manager:7019
      BDP_SVC_7023: http://bdp-oracle-migration:7023
      BDP_WS_7002: ws://bdp-cluster-manager:7002
      BDP_WS_7003: ws://bdp-service-manager:7003
      BDP_WS_7023: ws://bdp-oracle-migration:7023
      # Grafana (Task E3) — same-origin behind the gateway, no path strip.
      # Service name is fixed via kube-prometheus-stack.grafana.fullnameOverride
      # below (observability block) so it doesn't depend on the release name.
      BDP_SVC_GRAFANA: http://bdp-observability-grafana:80
      # /ws/** is public: WebSocket JWTs ride as a query param the owning
      # service validates (browsers can't set WS Authorization headers).
      # /grafana/** is public too: Grafana authenticates the browser itself
      # via its own Keycloak generic_oauth session, not a BDP-issued JWT.
      BDP_GATEWAY_PUBLICPATHS: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/actuator/health,/ws/**,/grafana/**

seed:
  image: seed              # global.azure.images key (renders bdp/bdp-seed)
  backoffLimit: 3

# ── Pod janitor ──────────────────────────────────────────────────────────────
# Auto-deletes dead/orphaned pods (Error/Evicted/ContainerStatusUnknown) that
# pile up under node pressure. Namespace-scoped, runs on a schedule.
podJanitor:
  enabled: true
  schedule: "*/20 * * * *"
  # (The janitor's image comes from global.azure.images.janitor like every
  # other image — there is no per-block image override here.)
  # How long a Completed/Succeeded pod is kept before the janitor sweeps it.
  # Long enough that a just-finished install/hook Job still has its logs
  # available to whoever is debugging it; short enough that finished pods do
  # not accumulate indefinitely (37 had piled up on the dev server).
  # Anything older than this, or aged in hours/days, is deleted.
  completedRetentionMinutes: 60

# ── cert-manager (KServe prerequisite) ───────────────────────────────────────
# Installed alongside the platform so KServe (and any cert-consuming tool) can
# later be provisioned via BDP. On an egress-enabled cluster the upstream
# quay.io images work unchanged. For a STRICT air-gap listing, the images are
# pre-mirrored to <airgapRegistry>/tools/cert-manager-* — uncomment the image
# blocks below and set the registry to the marketplace ACR.
cert-manager:
  enabled: true
  crds:
    enabled: true
  # Air-gapped: all four cert-manager images are pulled from the marketplace ACR
  # (mirrored from quay.io/jetstack at v1.15.3). Enumerated in global.azure.images.
  image:
    registry: bdpmarketplace.azurecr.io
    repository: tools/cert-manager-controller
    digest: sha256:eee34b3de2dd63f7e5ac459fc2d407662d433fd267d574557b76ee3c7d4bc44f
  webhook:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/cert-manager-webhook
      digest: sha256:fdcb9ac4963fa1bb0c9d7cad38f0ba2c65328aa436f8653c998594d936a96488
  cainjector:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/cert-manager-cainjector
      digest: sha256:e0ce8ae280c8d7263663b6a6d3ea5e122632936cde9bdd5321cf7109199f51aa
  startupapicheck:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/cert-manager-startupapicheck
      digest: sha256:4cbc1b022a2385ce98d454dfc206834a26a3bb07d1d0b581cdc50c34a6bf927d

# ── KServe CRDs ──────────────────────────────────────────────────────────────
# The KServe controller (installed by BDP as a service) needs these CRDs to
# exist first; its webhook validates ClusterServingRuntime objects defined here.
kserve-crd:
  enabled: true

# ── Shared data volume (Task D1) ─────────────────────────────────────────────
# Optional RWX PVC (bdp-shared-data) that tools opting in via their descriptor's
# top-level `sharedStorage` block mount at a common path (e.g. a shared
# drop-folder or driver-jars directory for NiFi/Spark/Airflow). Enabled by
# default (per the original design) — service-manager only injects the mount
# into a chart's values when BOTH this flag AND the descriptor opt-in are true
# (see BDP_SHARED_STORAGE_ENABLED below and bdp-platform's
# ServiceManagerService/SharedStorageValues), so flipping this to false is
# enough to disable the feature end-to-end without touching descriptors.
#
# Local kind clusters: kind ships no RWX-capable StorageClass by default.
# rancher.io/local-path (kind's bundled provisioner, often aliased "standard")
# only satisfies ReadWriteOnce and is single-node — set storageClassName:
# "standard" here only for local smoke-testing on a single-node kind cluster,
# where "RWX" in practice just means "the one node can read/write it"; it does
# NOT provide true multi-node ReadWriteMany semantics. Use azurefile-csi (or
# another real RWX class) for anything beyond single-node local dev. Note
# that a bare local kind cluster with no BDP umbrella chart installed at all
# never creates this PVC regardless of this value — service-manager's
# BDP_SHARED_STORAGE_ENABLED env only exists once the chart is deployed.
sharedStorage:
  enabled: true
  storageClass: "azurefile-csi"
  size: 50Gi

# ── Ingress controller ───────────────────────────────────────────────────────
# Ships WITH the platform. Without a controller the chart's Ingress is never
# claimed, no LoadBalancer is provisioned, and there is no public address --
# the platform runs perfectly and is unreachable, which is exactly what
# marketplace deployments were hitting.
#
# Set enabled: false on a cluster that already runs one, and point
# global.ingressClassName at the existing class.
ingress-nginx:
  enabled: true
  controller:
    # Pinned to the marketplace ACR by digest, like every other image here.
    # The digest matches registry.k8s.io because the mirror is done with
    # `crane cp`, which copies the multi-arch index byte for byte.
    #
    # Do NOT mirror this with `az acr import --source <digest>`: that resolves
    # the index to ONE platform manifest, and it picked a non-amd64 one. The
    # image pulled fine and then crashlooped with
    #   exec /usr/bin/dumb-init: exec format error
    # which reads like a broken image rather than a broken mirror.
    image:
      registry: bdpmarketplace.azurecr.io
      image: tools/ingress-nginx/controller
      tag: "v1.15.1"
      digest: sha256:594ceea76b01c592858f803f9ff4d2cb40542cae2060410b2c95f75907d659e1
      # chroot variant is not mirrored; keep chroot false so digestChroot is
      # never consulted.
      chroot: false
      digestChroot: ""
    service:
      annotations:
        # REQUIRED on AKS. Azure's load balancer health-probes "/" by default,
        # which nginx answers with 404, so the LB marks every backend unhealthy
        # and no traffic is ever forwarded. /healthz is the controller's own
        # probe endpoint. Omitting this produces a LoadBalancer that has a
        # public IP and still serves nothing.
        service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
    # The admission webhook rejects malformed Ingress objects. Left on: the
    # platform's own Ingress is generated, but tool provisioning creates more
    # at runtime and a bad one should fail loudly rather than silently.
    admissionWebhooks:
      enabled: true
      patch:
        image:
          registry: bdpmarketplace.azurecr.io
          image: tools/ingress-nginx/kube-webhook-certgen
          tag: v1.6.9
          digest: sha256:01038e7de14b78d702d2849c3aad72fd25903c4765af63cf16aa3398f5d5f2dd

# ── Observability (Task E1) ──────────────────────────────────────────────────
# kube-prometheus-stack (Prometheus + Alertmanager + Grafana) and Loki, vendored
# as decompressed subcharts under charts/bdp/charts/ like postgresql/redis/
# keycloak/kserve-crd above. Metrics wiring (ServiceMonitors) is Task E2,
# Grafana same-origin + Keycloak SSO is Task E3, Alertmanager webhook is
# Task E4, Loki retention + catalogue entry is Task E5.
observability:
  enabled: true

# Grafana <-> Keycloak OAuth client secret (Task E3). Rendered into the
# bdp-grafana-oauth Secret (templates/grafana-oauth-secret.yaml) and consumed
# by Grafana via envValueFrom (see kube-prometheus-stack.grafana above). Must
# match the secret the seed job (bdp-platform scripts/setup-server.js) sets
# on the Keycloak "grafana" client — override for any real deployment.
grafanaOAuth:
  clientSecret: "bdp-grafana-secret"

kube-prometheus-stack:
  # The vendored `crds` subchart (charts/kube-prometheus-stack/charts/crds)
  # must stay enabled — it's what installs the prometheus-operator CRDs at
  # all, via Helm's native crds/ directory (applied unconditionally on first
  # `helm install`, never touched again by `helm upgrade` — that's a Helm
  # limitation, not a bug). `upgradeJob` turns on that same subchart's own
  # pre-install/pre-upgrade Helm-hook Job, which runs `kubectl apply
  # --server-side` from a bzip2'd ConfigMap of the identical CRDs — this is
  # what actually keeps the CRDs current across `helm upgrade`, and it avoids
  # the well-known "metadata.annotations: Too long" failure a client-side
  # `kubectl apply` hits on these CRDs (several are 600-800KB each). No
  # bespoke SSA CRD Job was added under charts/bdp/templates/ — this vendored
  # chart version (87.19.2) already ships one, so we just turn it on instead
  # of duplicating it.
  crds:
    enabled: true
    upgradeJob:
      enabled: true
      # Task G1: air-gapped — busybox/kubectl containers of this Helm-hook Job.
      # NOTE: this vendored chart's own upgrade/job.yaml guards the busybox
      # digest suffix on `.Values.upgradeJob.image.sha` (a top-level key that
      # doesn't exist) instead of `.busybox.sha` — an upstream template bug
      # that means busybox is only ever pinned by tag here, never by digest,
      # regardless of what's set below. tag is still required (no template
      # default) so it must be explicit. kubectl's guard is correct and
      # honors kubectl.sha; its tag also must be pinned explicitly — the
      # template otherwise defaults it to the running cluster's own Kubernetes
      # version, which may not match the v1.31.0 build mirrored to ACR.
      image:
        busybox:
          registry: bdpmarketplace.azurecr.io
          repository: tools/busybox
          tag: "latest"
          sha: 1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8
        kubectl:
          registry: bdpmarketplace.azurecr.io
          repository: tools/kubectl
          tag: v1.31.0
          sha: 99b37df34bc4f99ee322521d4c85cb98c1ceb8f70ff0618bef84eec9fe1ebc20
  # Task G1: operator image, its dynamically-injected config-reloader sidecar
  # (passed as a --prometheus-config-reloader= CLI arg to every Prometheus/
  # Alertmanager pod the operator creates — never appears in a static `helm
  # template` render, but is a real air-gap dependency), and the
  # kube-webhook-certgen image used by both the admission create+patch Jobs.
  # All three templates read `.image.sha` (bare hex, chart appends the
  # "sha256:" prefix itself) — NOT `.image.digest` like the Bitnami-style
  # subcharts above.
  prometheusOperator:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/prometheus-operator
      tag: v0.92.1
      sha: 5835318d3506dd6d8676f2a1316776ac70f1b0b7cc0bce861213559ea855b8f2
    prometheusConfigReloader:
      image:
        registry: bdpmarketplace.azurecr.io
        repository: tools/prometheus-config-reloader
        tag: v0.92.1
        sha: bf6f3527663207af1d936e4f3f27c7a4aab703c0de2a82844f95c14af35dfe19
    admissionWebhooks:
      patch:
        image:
          registry: bdpmarketplace.azurecr.io
          repository: tools/kube-webhook-certgen
          tag: "1.8.5"
          sha: 490c269f2a793f75806acbaa558b63606cfdd01865307156e589347956dbc443
  prometheus:
    prometheusSpec:
      retention: 15d
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      # Task G1
      image:
        registry: bdpmarketplace.azurecr.io
        repository: tools/prometheus
        tag: v3.13.1-distroless
        sha: 335b5796a6e4355530475575253f84de20b8ad07bf899f65ed218451ce4c60b4
  # Task E4: routes every firing/resolved alert to bdp-notification-service's
  # Alertmanager webhook receiver (bdp-platform's AlertmanagerWebhookController,
  # POST /api/v1/notifications/alertmanager) so alerts show up in the BDP
  # notification inbox. Service name + port match the fixed bdp-notification-
  # service Service (see .Values.services["bdp-notification-service"] /
  # BDP_SVC_7011 above) — not release-name-prefixed. Structure otherwise
  # mirrors the vendored kube-prometheus-stack chart's own default alertmanager
  # config (global/inhibit_rules/templates unchanged); only route.receiver and
  # the receivers list differ, to point at 'bdp' instead of 'null'.
  alertmanager:
    # Task G1
    alertmanagerSpec:
      image:
        registry: bdpmarketplace.azurecr.io
        repository: tools/alertmanager
        tag: v0.33.1
        sha: a89f8d4520954079275441eecdb71444328bd90633dd4eddfc33b9ed657f349b
      # Persist silences (and the notification log) across pod restarts —
      # without this, every silence created via the Alertmanager UI/API is
      # lost the moment the pod is rescheduled. Silences are tiny (a handful
      # of KB each even at hundreds of entries), so 2Gi is generous headroom,
      # not a sizing based on expected volume. storageClassName is
      # deliberately omitted (not set to "") so the cluster's default
      # StorageClass is used — same pattern as prometheus.prometheusSpec
      # above and postgresql/redis/loki elsewhere in this file; setting it to
      # an empty string here would disable dynamic provisioning entirely
      # (the NiFi chart hit exactly this trap earlier).
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers:
            - 'severity = critical'
          target_matchers:
            - 'severity =~ warning|info'
          equal:
            - 'namespace'
            - 'alertname'
        - source_matchers:
            - 'severity = warning'
          target_matchers:
            - 'severity = info'
          equal:
            - 'namespace'
            - 'alertname'
        - source_matchers:
            - 'alertname = InfoInhibitor'
          target_matchers:
            - 'severity = info'
          equal:
            - 'namespace'
        - target_matchers:
            - 'alertname = InfoInhibitor'
      route:
        group_by: ['namespace']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'bdp'
        routes:
          - receiver: 'null'
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: 'null'
        - name: 'bdp'
          webhook_configs:
            - url: "http://bdp-notification-service:7011/api/v1/notifications/alertmanager"
      templates:
        - '/etc/alertmanager/config/*.tmpl'
  # Task G1 — grandchild subcharts of kube-prometheus-stack, so their image
  # overrides nest one level deeper than postgresql/redis/keycloak above.
  kube-state-metrics:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/kube-state-metrics
      tag: v2.19.1
      # This chart's own helper appends .image.sha after "@" with no prefix
      # (unlike prometheus/alertmanager/prometheus-operator's bare-hex "sha"
      # convention above) — the full "sha256:" prefix must be included here.
      sha: sha256:7661da8c99b733d43117e4cba12bd9865d335e5777191d0af3d789807aded9f4
  prometheus-node-exporter:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/node-exporter
      # This chart's own image.distroless: true default (set below the
      # `image:` block's default in this subchart's values) makes the render
      # helper append "-distroless" to whatever tag is set here — leave it
      # off here or the rendered tag doubles up to "...-distroless-distroless".
      tag: v1.12.1
      digest: sha256:bbfbd533202cfef891c70383ddf6f0c32acece66400ad8091a18bed7aad5db6f
  grafana:
    # Fixed name (like postgresql.fullnameOverride above) so the gateway's
    # BDP_SVC_GRAFANA route target and the Ingress path added for /grafana
    # don't depend on the Helm release name.
    fullnameOverride: bdp-observability-grafana
    # Task G1
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/grafana
      tag: "13.1.3"
      sha: ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    sidecar:
      image:
        registry: bdpmarketplace.azurecr.io
        repository: tools/k8s-sidecar
        tag: "2.8.1"
        sha: 44065fae116464099acd5bfddb62dcb2cf53c8fa18948d215109d64a5560306e
    grafana.ini:
      server:
        root_url: "%(protocol)s://%(domain)s/grafana"
        serve_from_sub_path: true
      security:
        allow_embedding: true
      auth.generic_oauth:
        enabled: true
        name: BDP SSO
        client_id: grafana
        client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
        scopes: "openid profile email"
        # Browser-facing: same keycloak.<externalDomain> host the main
        # ingress (templates/ingress.yaml) and bdp.keycloakExternalIssuer
        # helper already use — NOT <domain>/auth/... (no such path exists).
        auth_url: "https://keycloak.{{ .Values.global.externalDomain }}/realms/bdp/protocol/openid-connect/auth"
        # Backchannel (token exchange + userinfo): in-cluster Keycloak
        # service DNS, matching the bdp.keycloakInternalUrl helper.
        token_url: "http://{{ .Release.Name }}-keycloak:80/realms/bdp/protocol/openid-connect/token"
        api_url: "http://{{ .Release.Name }}-keycloak:80/realms/bdp/protocol/openid-connect/userinfo"
        # NOTE: the brief's literal snippet used 'bdp-admin', but this
        # codebase's actual realm role (BDP_ROLES in scripts/setup-server.js,
        # and SecurityConfig.java's ROLE_ prefix on the verbatim Keycloak role
        # name) is plain 'admin' — matching that here.
        role_attribute_path: "contains(realm_access.roles[*], 'admin') && 'GrafanaAdmin' || 'Viewer'"
    # Client secret injected from a Secret (templates/grafana-oauth-secret.yaml)
    # rather than inlined here — see grafanaOAuth.clientSecret below.
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: bdp-grafana-oauth
          key: client-secret
    # Task E5 follow-up: Prometheus and Alertmanager are auto-provisioned
    # above via grafana.sidecar.datasources (they're siblings inside this
    # same kube-prometheus-stack chart); Loki is a separate subchart so it
    # isn't covered by that mechanism and needs an explicit entry here.
    # Points at the fixed loki.fullnameOverride Service (bdp-observability-
    # loki, port 3100 == loki.loki.server.http_listen_port default) so
    # "Explore -> Loki" works in Grafana alongside BDP's own pod-log-
    # streaming. This whole additionalDataSources list only renders while
    # the kube-prometheus-stack subchart itself does (condition:
    # observability.enabled in Chart.yaml), so no extra gating is needed
    # here.
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://bdp-observability-loki:3100
        isDefault: false
        editable: false

# Loki — SingleBinary deployment (single pod, PVC-backed local filesystem
# storage; no external S3/GCS/Azure object-store dependency). The upstream
# chart's storage.type defaults to "s3" and its schemaConfig is intentionally
# left empty (chart-level `fail` guard forces every consumer to pick one) —
# both are overridden below to the filesystem+tsdb combination the chart's
# own test-schema helper (loki.testSchemaObjectStore) resolves to when minio
# is disabled, but as a real (non-test) schemaConfig so it isn't subject to
# the "no persistence" caveat useTestSchema carries.
loki:
  # Fixed name (like grafana.fullnameOverride above) so service-manager's
  # BDP_LOKI_URL env var (templates/services.yaml) can address it by a
  # name that doesn't depend on the Helm release name.
  fullnameOverride: bdp-observability-loki
  deploymentMode: SingleBinary
  # The chart's SimpleScalable-mode targets (write/read/backend) default to
  # 3 replicas each regardless of deploymentMode — an upstream quirk (see
  # templates/validate.yaml) that must be zeroed out explicitly, or the chart
  # refuses to render ("Cannot run scalable targets... without an object
  # storage backend").
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  loki:
    # Single-tenant deployment: one BDP install == one tenant. The loki chart
    # defaults this to true, which makes Loki reject every push and query that
    # arrives without an X-Scope-OrgID header (401 "no org id") — neither the
    # Alloy collector (Task H1) nor service-manager's LokiLogClient (Task E5)
    # sends one, so with the default the 20Gi volume would silently stay empty
    # and log queries would always fail. Disabling auth fixes both ends at once.
    auth_enabled: false
    commonConfig:
      # MUST be 1 for SingleBinary. The loki chart defaults this to 3 while
      # SingleBinary runs exactly one replica, so the ring never reaches quorum
      # and Loki rejects EVERY write:
      #   POST /loki/api/v1/push (500) "at least 2 live replicas required,
      #   could only find 1"
      # and every query with "too many unhealthy instances in the ring".
      #
      # Silent from the outside — pods Ready, nothing CrashLooping, Grafana's
      # Loki datasource present — but zero logs ingested and BDP's pod-log
      # streaming (Task E5) returning nothing. Found on the dev server and
      # fixed in the standalone bdp-observability chart 1.0.4; this umbrella
      # carried the same default, so Loki had never ingested here either.
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
    # Task G1: main loki server container image.
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/loki
      tag: "3.6.8"
      digest: sha256:9b6b43f12310b10cb03de65bd45ac039366a78e31e89fa03f2eab2f699d227b3
  singleBinary:
    persistence:
      size: 20Gi
  # Task G1: the loki chart's remaining image references are its own
  # top-level keys (not grandchild subcharts — these are templates within
  # the loki chart itself), so they nest at the same level as loki.loki
  # above, i.e. loki.<key>.image here.
  test:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/loki-helm-test
      tag: "latest"
      digest: sha256:4c682a8a7c94b1e16c36d9712be085ffc1d8eff9d5e1a116b456c7710fdc2121
  lokiCanary:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/loki-canary
      tag: "3.6.15"
      digest: sha256:943197a9ee4236cecb9a53a56e643034a293f929df7bccba416304ca3d118c10
  gateway:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/nginx-unprivileged
      tag: "1.29-alpine"
      digest: sha256:8059701048a6cc7d64e8ab2812a44be70161bfa9ecfc01d69e95b8ff2a648705
  memcached:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/memcached
      tag: "1.6.39-alpine"
      digest: sha256:aac456c35cd29635b5501fefac58a2e954752006c9d159fbf520dd785e09cbba
  memcachedExporter:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/memcached-exporter
      tag: v0.15.4
      digest: sha256:f3db25665b3a1dfbb043d67686f8c3b11483482684ddf475a0845c2cf50c0489
  sidecar:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/k8s-sidecar
      tag: "2.5.0"
      sha: 4f8f7ff326827489dc3742e17cd0e04e2f89deb49f67021d2a5418d8b78e7ddc

# ── Log collector (Task H1) ──────────────────────────────────────────────────
# Grafana Alloy — the loki/promtail successor, current and actively
# maintained (Promtail entered LTS-only maintenance in Feb 2025 with EOL in
# 2026, so the log-shipping engine that will still receive fixes past this
# platform's support horizon is Alloy, not Promtail). Deployed as a DaemonSet
# (this chart's controller.type default — left implicit) so every node's pods
# are covered.
#
# Discovery/shipping uses River config wired below (alloy.configMap.content),
# NOT the chart's default config (empty) or the PodLogs-CRD-based mode (that
# CRD's dependency condition is turned off — crds.create: false — since
# nothing here creates a PodLogs resource). discovery.kubernetes (role: pod)
# + loki.source.kubernetes tails every pod's logs via the Kubernetes API
# server's pods/log subresource rather than a hostPath /var/log mount like
# Promtail requires — no hostPath volume/securityContext concessions needed,
# which matters here because this chart ships to arbitrary (including
# managed, restricted) clusters, not just one known environment. Trade-off
# (documented upstream): more load on the API server than node-local file
# tailing at very high log volume — acceptable for this platform's per-tool
# service log volumes.
#
# This chart's own default rbac.rules + clusterRules (rbac.create: true,
# left at its default — not overridden here) already grant everything both
# components need (pods/log, namespaces, nodes, nodes/pods, nodes/metrics),
# so no RBAC override was necessary.
alloy:
  crds:
    # PodLogs CRD (monitoring.grafana.com) — unused, the River config below
    # drives discovery directly rather than via a PodLogs custom resource.
    create: false
  alloy:
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.write.default.receiver]
        }

        // Push path verified against the vendored loki chart's single-binary
        // Service (fullnameOverride bdp-observability-loki, port 3100 ==
        // loki.server.http_listen_port) — this is Loki's native HTTP API
        // port, not the gateway/nginx Service, so no path prefix is needed
        // beyond the standard Loki push route.
        loki.write "default" {
          endpoint {
            url = "http://bdp-observability-loki:3100/loki/api/v1/push"
          }
        }
  # Task H1: main container image, keyed "alloy" in global.azure.images above.
  # tag/repository are vestigial for the image: line itself (patched in
  # templates/containers/_agent.yaml to read global.azure.images directly,
  # per the G1 cainjector-lesson idiom) but kept accurate for imagePullPolicy
  # display purposes.
  image:
    registry: bdpmarketplace.azurecr.io
    repository: tools/alloy
    tag: v1.18.0
  # config-reloader sidecar deliberately reuses the "config-reloader" key
  # already mirrored for kube-prometheus-stack's operator-injected sidecar —
  # identical upstream image (quay.io/prometheus-operator/prometheus-config-
  # reloader), and its --watched-dir/--reload-url flags are generic, not
  # Prometheus-specific, so no second image needed for the same tool.
  configReloader:
    image:
      registry: bdpmarketplace.azurecr.io
      repository: tools/prometheus-config-reloader
      tag: v0.92.1
