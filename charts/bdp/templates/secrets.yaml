{{- /* Random secrets generated at install, preserved across upgrades via lookup. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "bdp-platform-secrets" -}}
apiVersion: v1
kind: Secret
metadata:
  name: bdp-platform-secrets
  labels:
    app.kubernetes.io/part-of: bdp
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  master-key: {{ index $existing.data "master-key" }}
  minio-access-key: {{ index $existing.data "minio-access-key" }}
  minio-secret-key: {{ index $existing.data "minio-secret-key" }}
  nextauth-secret: {{ index $existing.data "nextauth-secret" }}
  {{- else }}
  {{- /* randBytes already returns base64 (the key value); b64enc wraps it for Secret data */}}
  master-key: {{ randBytes 32 | b64enc }}
  minio-access-key: {{ printf "bdp-%s" (randAlphaNum 8) | b64enc }}
  minio-secret-key: {{ randAlphaNum 32 | b64enc }}
  nextauth-secret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
---
{{- /* Client secret of the bdp-admin-svc Keycloak client, which bdp-auth-service
       (Users/Roles pages) and bdp-domain-manager use to call the Keycloak Admin
       API. Generated once and kept across upgrades. It used to be the literal
       "bdp-admin-svc-secret" built into both services -- a published password
       for an account that can rewrite every user and permission. The
       keycloak-authz job creates the client with THIS value, and the two
       services read it as BDP_KEYCLOAK_ADMIN_CLIENT_SECRET (services.secretEnv). */}}
{{- $adminSvc := lookup "v1" "Secret" .Release.Namespace "bdp-keycloak-admin-svc" }}
apiVersion: v1
kind: Secret
metadata:
  name: bdp-keycloak-admin-svc
  labels:
    app.kubernetes.io/part-of: bdp
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $adminSvc }}
  client-secret: {{ index $adminSvc.data "client-secret" }}
  {{- else }}
  client-secret: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- if .Values.global.airgapRegistryUsername }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bdp-airgap-registry
  labels:
    app.kubernetes.io/part-of: bdp
type: Opaque
stringData:
  username: {{ .Values.global.airgapRegistryUsername | quote }}
  password: {{ .Values.global.airgapRegistryPassword | quote }}
{{- end }}
