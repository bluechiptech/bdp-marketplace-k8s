{{- /* Random secrets generated at install, preserved across upgrades via lookup. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "bdp-platform-secrets" -}}
apiVersion: v1
kind: Secret
metadata:
  name: bdp-platform-secrets
  labels:
    app.kubernetes.io/part-of: bdp
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  master-key: {{ index $existing.data "master-key" }}
  minio-access-key: {{ index $existing.data "minio-access-key" }}
  minio-secret-key: {{ index $existing.data "minio-secret-key" }}
  {{- else }}
  {{- /* randBytes already returns base64 (the key value); b64enc wraps it for Secret data */}}
  master-key: {{ randBytes 32 | b64enc }}
  minio-access-key: {{ printf "bdp-%s" (randAlphaNum 8) | b64enc }}
  minio-secret-key: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
