{{- /* One Deployment + Service per entry in .Values.services */ -}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: bdp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: bdp
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $svc.serviceAccount }}
      serviceAccountName: {{ $svc.serviceAccount }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: {{ $name }}
          image: {{ include "bdp.image" (dict "root" $root "name" $name) }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: SERVER_PORT
              value: {{ $svc.port | quote }}
            {{- include "bdp.commonEnv" $root | nindent 12 }}
            {{- if $svc.db }}
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ include "bdp.postgresHost" $root }}:5432/{{ $svc.db }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ $svc.db }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ $svc.db }}
            - name: SPRING_FLYWAY_URL
              value: jdbc:postgresql://{{ include "bdp.postgresHost" $root }}:5432/{{ $svc.db }}
            - name: SPRING_FLYWAY_USER
              value: {{ $svc.db }}
            - name: SPRING_FLYWAY_PASSWORD
              value: {{ $svc.db }}
            {{- end }}
            {{- if or (eq $name "bdp-service-manager") (eq $name "bdp-storage-manager") (eq $name "bdp-catalog") (eq $name "bdp-backup-manager") (eq $name "bdp-oracle-migration") }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: bdp-platform-secrets, key: minio-access-key }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: bdp-platform-secrets, key: minio-secret-key }
            {{- end }}
            {{- /* Task D1 fix: service-manager only injects the bdp-shared-data
            mount into a chart's values when this flag is true, so it always
            matches whether the PVC below is actually enabled/created. */}}
            {{- if eq $name "bdp-service-manager" }}
            - name: BDP_SHARED_STORAGE_ENABLED
              value: {{ $root.Values.sharedStorage.enabled | quote }}
            {{- /* Task E4: service-manager only server-side-applies a tool's
            Grafana dashboard ConfigMap when this flag is true, so it always
            matches whether the Grafana dashboard sidecar (observability
            subchart below) actually exists to pick it up. */}}
            - name: BDP_OBSERVABILITY_ENABLED
              value: {{ $root.Values.observability.enabled | quote }}
            {{- /* Task E5 fix: BDP_LOKI_URL only set when observability is
            enabled, so LokiLogClient's empty-string-means-disabled gate
            (bdp.observability.loki-url:${BDP_LOKI_URL:}) matches whether
            the Loki service (loki.fullnameOverride above) actually exists
            in this release — omitted entirely rather than set empty. */}}
            {{- if $root.Values.observability.enabled }}
            - name: BDP_LOKI_URL
              value: "http://bdp-observability-loki:3100"
            {{- end }}
            {{- end }}
            {{- /* BYOL: point license-manager at the mounted vendor-signed
            license file and turn on signed enforcement (licenses can then
            only enter via a signature-verified file — the create API is
            disabled and unsigned rows never validate). */}}
            {{- if and (eq $name "bdp-license-manager") (eq $root.Values.billing.mode "byol") $root.Values.billing.licenseSecretName }}
            - name: BDP_LICENSE_FILE
              value: /etc/bdp/license/license.key
            - name: BDP_LICENSE_ENFORCE_SIGNED
              value: "true"
            {{- end }}
            {{- range $k, $v := ($svc.extraEnv | default dict) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml $root.Values.serviceDefaults.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: { port: {{ $svc.port }} }
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
          {{- if and (eq $name "bdp-license-manager") (eq $root.Values.billing.mode "byol") $root.Values.billing.licenseSecretName }}
          volumeMounts:
            - name: license
              mountPath: /etc/bdp/license
              readOnly: true
      {{- /* optional: the pod starts before the customer creates the secret;
      the license imports on the next restart after it exists */}}
      volumes:
        - name: license
          secret:
            secretName: {{ $root.Values.billing.licenseSecretName }}
            optional: true
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: bdp
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
---
{{- /* Task H1: one ServiceMonitor per platform service, scraping the
       micrometer /actuator/prometheus endpoint (bdp-common, Task E2) on the
       same named "http" port every Service above now exposes. Gated on
       observability.enabled so a disabled render is unchanged. The `release`
       label is required: kube-prometheus-stack's Prometheus CR defaults
       serviceMonitorSelector to matchLabels.release: <release name> (see
       prometheusSpec.serviceMonitorSelectorNilUsesHelmValues, on by default
       in the vendored chart) — without it these ServiceMonitors render but
       are never picked up. */ -}}
{{- if $root.Values.observability.enabled }}
{{- range $name, $svc := $root.Values.services }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: bdp
    release: {{ $root.Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
{{- end }}
{{- end }}
---
{{- /* Provisioner installs data tools with in-cluster RBAC, not a kubeconfig */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bdp-provisioner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bdp-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin   # TODO: narrow to the verbs helm installs actually need
subjects:
  - kind: ServiceAccount
    name: bdp-provisioner
    namespace: {{ .Release.Namespace }}
---
{{- /* service-manager reads pod/secret/service state (install progress,
       health, helm-release discovery) and scales tool workloads on
       start/stop. Scoped read + workload-scale — NOT cluster-admin. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bdp-service-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bdp-service-manager
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, secrets, configmaps, namespaces, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets, daemonsets, deployments/scale, statefulsets/scale]
    verbs: [get, list, watch, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bdp-service-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bdp-service-manager
subjects:
  - kind: ServiceAccount
    name: bdp-service-manager
    namespace: {{ .Release.Namespace }}
---
{{- /* Ingress WRITE is deliberately NOT in the cluster-wide role above:
       cluster-wide ingress create/update is an ingress-hijack risk. Tool UIs
       only ever get an Ingress in the tools namespace, so scope that write to
       a namespaced Role there instead. */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.toolsNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bdp-service-manager-tool-ui
  namespace: {{ .Values.global.toolsNamespace }}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bdp-service-manager-tool-ui
  namespace: {{ .Values.global.toolsNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bdp-service-manager-tool-ui
subjects:
  - kind: ServiceAccount
    name: bdp-service-manager
    namespace: {{ .Release.Namespace }}
