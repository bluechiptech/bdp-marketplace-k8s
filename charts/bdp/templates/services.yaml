{{- /* One Deployment + Service per entry in .Values.services */ -}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: bdp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: bdp
    spec:
      {{- if $svc.serviceAccount }}
      serviceAccountName: {{ $svc.serviceAccount }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: {{ $name }}
          image: {{ include "bdp.image" (dict "root" $root "name" $name) }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            - name: SERVER_PORT
              value: {{ $svc.port | quote }}
            {{- include "bdp.commonEnv" $root | nindent 12 }}
            {{- if $svc.db }}
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ include "bdp.postgresHost" $root }}:5432/{{ $svc.db }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ $svc.db }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ $svc.db }}
            - name: SPRING_FLYWAY_URL
              value: jdbc:postgresql://{{ include "bdp.postgresHost" $root }}:5432/{{ $svc.db }}
            - name: SPRING_FLYWAY_USER
              value: {{ $svc.db }}
            - name: SPRING_FLYWAY_PASSWORD
              value: {{ $svc.db }}
            {{- end }}
            {{- if or (eq $name "bdp-service-manager") (eq $name "bdp-storage-manager") (eq $name "bdp-catalog") (eq $name "bdp-backup-manager") (eq $name "bdp-oracle-migration") }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: bdp-platform-secrets, key: minio-access-key }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: bdp-platform-secrets, key: minio-secret-key }
            {{- end }}
            {{- range $k, $v := ($svc.extraEnv | default dict) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml $root.Values.serviceDefaults.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: { port: {{ $svc.port }} }
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: bdp
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
---
{{- /* Provisioner installs data tools with in-cluster RBAC, not a kubeconfig */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bdp-provisioner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bdp-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin   # TODO: narrow to the verbs helm installs actually need
subjects:
  - kind: ServiceAccount
    name: bdp-provisioner
    namespace: {{ .Release.Namespace }}
---
{{- /* service-manager reads pod/secret/service state (install progress,
       health, helm-release discovery) and scales tool workloads on
       start/stop. Scoped read + workload-scale — NOT cluster-admin. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bdp-service-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bdp-service-manager
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, secrets, configmaps, namespaces, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets, daemonsets, deployments/scale, statefulsets/scale]
    verbs: [get, list, watch, patch, update]
  # Tool-UI access in ingress mode publishes a per-tool subdomain Ingress.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bdp-service-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bdp-service-manager
subjects:
  - kind: ServiceAccount
    name: bdp-service-manager
    namespace: {{ .Release.Namespace }}
