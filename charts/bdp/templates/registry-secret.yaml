{{- /* Optional dockerconfigjson pull secret for clusters that authenticate to
      the image registry with credentials instead of cloud identity (AKS
      marketplace installs pull via the cluster's AcrPull managed identity and
      never render this). Created in BOTH the release namespace (platform
      workloads) and global.toolsNamespace (tool pods installed by the
      provisioner), because imagePullSecrets are namespace-scoped. Creating the
      secret does not attach it — its name must be listed in
      global.imagePullSecrets. */ -}}
{{- if .Values.global.registryCredentials.create }}
{{- $rc := .Values.global.registryCredentials }}
{{- $registry := required "global.registryCredentials.registry is required when create is true" $rc.registry }}
{{- $username := required "global.registryCredentials.username is required when create is true" $rc.username }}
{{- $password := required "global.registryCredentials.password is required when create is true" $rc.password }}
{{- $auth := printf "%s:%s" $username $password | b64enc }}
{{- $cfg := dict "auths" (dict $registry (dict "username" $username "password" $password "auth" $auth)) | toJson }}
{{- range $ns := list $.Release.Namespace $.Values.global.toolsNamespace | uniq }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rc.name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: bdp
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg | b64enc }}
{{- end }}
{{- end }}
