apiVersion: apps/v1
kind: Deployment
metadata:
  name: bdp-ui
  labels:
    app.kubernetes.io/name: bdp-ui
    app.kubernetes.io/part-of: bdp
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bdp-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bdp-ui
        app.kubernetes.io/part-of: bdp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      {{- if .Values.global.keycloakHostAliasIp }}
      # Managed-K8s LBs often don't hairpin, so the UI pod can't reach the
      # public Keycloak host for server-side OIDC calls. Resolve it to the
      # in-cluster ingress controller instead. The OIDC issuer must stay the
      # external URL (token `iss` must match), so we remap the name, not the URL.
      hostAliases:
        - ip: {{ .Values.global.keycloakHostAliasIp | quote }}
          hostnames:
            - keycloak.{{ .Values.global.externalDomain }}
      {{- end }}
      containers:
        - name: bdp-ui
          image: {{ include "bdp.image" (dict "root" . "name" "bdp-ui") }}
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            # UI proxies /api/* to the gateway
            - name: BDP_GATEWAY_URL
              value: http://bdp-gateway:7000
            - name: NEXT_PUBLIC_KEYCLOAK_URL
              value: https://keycloak.{{ .Values.global.externalDomain }}
            # NextAuth (server-side): callback/cookie base URL and the OIDC
            # issuer it discovers + exchanges tokens against.
            - name: NEXTAUTH_URL
              value: https://{{ .Values.global.externalDomain }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef: { name: bdp-platform-secrets, key: nextauth-secret }
            - name: KEYCLOAK_ISSUER
              value: https://keycloak.{{ .Values.global.externalDomain }}/realms/bdp
            {{- if .Values.global.insecureSkipTlsVerify }}
            # INSECURE (opt-in, testing only): skips TLS verification on the UI
            # pod's server-side OIDC calls so it accepts the ingress self-signed
            # default cert. Off by default — provide global.tlsSecretName (a real
            # cert, e.g. cert-manager) for production instead of enabling this.
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bdp-ui
  labels:
    app.kubernetes.io/part-of: bdp
spec:
  selector:
    app.kubernetes.io/name: bdp-ui
  ports:
    - port: 3000
      targetPort: 3000
