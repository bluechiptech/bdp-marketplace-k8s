apiVersion: apps/v1
kind: Deployment
metadata:
  name: bdp-ui
  labels:
    app.kubernetes.io/name: bdp-ui
    app.kubernetes.io/part-of: bdp
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bdp-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bdp-ui
        app.kubernetes.io/part-of: bdp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: bdp-ui
          image: {{ include "bdp.image" (dict "root" . "name" "bdp-ui") }}
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            # UI proxies /api/* to the gateway
            - name: BDP_GATEWAY_URL
              value: http://bdp-gateway:7000
            - name: NEXT_PUBLIC_KEYCLOAK_URL
              value: https://keycloak.{{ .Values.global.externalDomain }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bdp-ui
  labels:
    app.kubernetes.io/part-of: bdp
spec:
  selector:
    app.kubernetes.io/name: bdp-ui
  ports:
    - port: 3000
      targetPort: 3000
