{{- /* Grafana <-> Keycloak generic_oauth client secret (Task E3). Gated on
       observability.enabled since Grafana itself only renders then. */ -}}
{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: bdp-grafana-oauth
  labels:
    app.kubernetes.io/part-of: bdp
type: Opaque
stringData:
  client-secret: {{ .Values.grafanaOAuth.clientSecret | quote }}
{{- end }}
