{{- if .Values.podJanitor.enabled }}
# Periodically deletes dead/orphaned pods (Error, Evicted, ContainerStatusUnknown,
# etc.) that accumulate when the node is under memory/disk pressure — kubelet
# loses track of them and k8s doesn't garbage-collect them. Scoped to this
# namespace (where BDP installs tools).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bdp-pod-janitor
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bdp-pod-janitor
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bdp-pod-janitor
  namespace: {{ .Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: bdp-pod-janitor }
subjects:
  - { kind: ServiceAccount, name: bdp-pod-janitor, namespace: {{ .Release.Namespace }} }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bdp-pod-janitor
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.podJanitor.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: bdp-pod-janitor
          restartPolicy: Never
          containers:
            - name: janitor
              image: "{{ .Values.global.azure.images.janitor.registry }}/{{ .Values.global.azure.images.janitor.image }}@{{ .Values.global.azure.images.janitor.digest }}"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "bdp-pod-janitor run $(date)"
                  # Dead pods: delete immediately, they hold no useful state.
                  kubectl -n {{ .Release.Namespace }} get pods --no-headers \
                    | awk '$3 ~ /Error|Evicted|ContainerStatusUnknown|Unknown|NodeLost/ {print $1}' \
                    | while read pod; do
                        echo "deleting dead $pod"
                        kubectl -n {{ .Release.Namespace }} delete pod "$pod" --grace-period=0 --force 2>/dev/null || true
                      done
                  # Finished pods (Completed/Succeeded) from Jobs and hooks. These
                  # were NOT swept before and are what actually piles up -- 37 had
                  # accumulated on the dev server, versus zero in the states above.
                  # They reserve no CPU/memory, so this is hygiene rather than a
                  # capacity fix, but it keeps `kubectl get pods` readable and stops
                  # the API server carrying dead objects indefinitely.
                  #
                  # Only sweep ones older than {{ .Values.podJanitor.completedRetentionMinutes }}m:
                  # a just-finished Job's pod still holds the logs someone debugging
                  # a failed install needs, and deleting it the moment it succeeds
                  # destroys that. Age is computed from the pod's AGE column rather
                  # than a timestamp lookup to keep this a single kubectl call.
                  kubectl -n {{ .Release.Namespace }} get pods --no-headers \
                    | awk '$3 ~ /Completed|Succeeded/ {print $1" "$5}' \
                    | while read pod age; do
                        keep=0
                        case "$age" in
                          *m) [ "${age%m}" -lt {{ .Values.podJanitor.completedRetentionMinutes }} ] && keep=1 ;;
                          *s) keep=1 ;;
                        esac
                        if [ "$keep" = "1" ]; then
                          echo "keeping recent $pod ($age)"
                        else
                          echo "deleting finished $pod ($age)"
                          kubectl -n {{ .Release.Namespace }} delete pod "$pod" --grace-period=0 --force 2>/dev/null || true
                        fi
                      done
                  echo "done"
{{- end }}
