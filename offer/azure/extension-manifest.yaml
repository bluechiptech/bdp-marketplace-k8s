# Azure Marketplace Kubernetes-application (container) offer packaging.
# The offer wraps the bdp chart as a CNAB bundle; Partner Center builds it
# from this manifest with the `cpa` (container-package-app) tool:
#   docker run ... mcr.microsoft.com/container-package-app:latest cpa buildbundle
applicationName: bdp
publisher: bluechiptech            # Partner Center publisher ID
description: Bluechip Data Platform — data-tool management plane for AKS
version: 1.0.5

helmChart:
  path: ../../charts/bdp
  # Images the CNAB references must live in the offer's ACR and be listed
  # here so Microsoft can mirror them into the marketplace registry.
  imageTemplates:
    registry: "{{ .Values.global.bdpImageRegistry }}"
    tag: "{{ .Values.global.bdpImageTag }}"

plans:
  - id: bdp-byol
    values: { billing.mode: byol }
  - id: bdp-flat
    values: { billing.mode: flat }
  - id: bdp-metered
    values: { billing.mode: metered }
    # dimension bdp_core_hours must exist on the plan in Partner Center
